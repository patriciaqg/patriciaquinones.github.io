<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="puzzleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#E06D53" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="puzzleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.28" flood-color="#1E293B"/>
    </filter>
  </defs>

  <!-- Background rounded plate for ultra-crisp tab visibility in dark & light browser bars -->
  <rect width="64" height="64" rx="16" fill="#FAF9F6" />

  <!-- Puzzle Piece Path -->
  <path d="M 22 13 
           H 27 
           C 27 7.5 37 7.5 37 13 
           H 42 
           A 6 6 0 0 1 48 19 
           V 27 
           C 53.5 27 53.5 37 48 37 
           V 45 
           A 6 6 0 0 1 42 51 
           H 37 
           C 37 45.5 27 45.5 27 51 
           H 22 
           A 6 6 0 0 1 16 45 
           V 37 
           C 21.5 37 21.5 27 16 27 
           V 19 
           A 6 6 0 0 1 22 13 Z" 
        fill="url(#puzzleGrad)" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#puzzleShadow)" />
</svg>
